site_name: Programación 1º DAW
site_author: Paco Guirau
theme:
  name: material
  language: es
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy
    - navigation.expand    
    
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list  
nav:
  - Inicio: index.md
  - 1 - Intro:
    - 1.1 Introducción y primer programa: ud1/01_introduccion.md
  - 2 - Java:
